name: Daily Episodic Video Factory

on:
  schedule:
    # 00:00 UTC = 08:00 AM Waktu Piawai Malaysia (MYT)
   # - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      manual_episode_id:
        description: 'ID Episod khusus (cth: EP_002) atau biar kosong untuk auto'
        required: false
        default: ''

concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  render_daily_episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Semak Keluar Repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sediakan Persekitaran Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Pasang Dependensi Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Jalankan Enjin Produksi Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_EPISODE_ID: ${{ github.event.inputs.manual_episode_id }}
        run: |
          python main.py

      - name: Muat Naik Artifak Video (Backup 14 Hari)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: episode-video-output
          path: output/*.mp4
          retention-days: 14

      - name: Simpan Kemas Kini Log Episod
        run: |
          git config --global user.name "Video Factory Bot"
          git config --global user.email "bot@videofactory.local"
          git add data/episode_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(log): kemas kini log episod [skip ci]" && git push)
